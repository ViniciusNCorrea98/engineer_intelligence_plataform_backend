services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EIP_DATABASE_NAME:?EIP_DATABASE_NAME is required}
      POSTGRES_USER: ${EIP_DATABASE_USERNAME:?EIP_DATABASE_USERNAME is required}
      POSTGRES_PASSWORD: ${EIP_DATABASE_PASSWORD:?EIP_DATABASE_PASSWORD is required}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
