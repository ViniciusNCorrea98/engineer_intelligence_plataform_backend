services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EIP_TEST_DATABASE_NAME:?EIP_TEST_DATABASE_NAME is required}
      POSTGRES_USER: ${EIP_TEST_DATABASE_USERNAME:?EIP_TEST_DATABASE_USERNAME is required}
      POSTGRES_PASSWORD: ${EIP_TEST_DATABASE_PASSWORD:?EIP_TEST_DATABASE_PASSWORD is required}
    ports:
      - "${EIP_TEST_DATABASE_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - eip-integration-test-postgres-data:/var/lib/postgresql/data

volumes:
  eip-integration-test-postgres-data:
    name: eip-integration-test-postgres-data
